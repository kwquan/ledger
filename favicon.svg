<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="inkTexture" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="14" fill="#10151A"/>

  <g transform="rotate(-4 32 32)" filter="url(#inkTexture)">
    <circle cx="32" cy="32" r="24" fill="none" stroke="#C1440E" stroke-width="3.6"/>
    <text
      x="32" y="32"
      text-anchor="middle"
      dominant-baseline="central"
      font-family="'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif"
      font-weight="700"
      font-size="30"
      fill="#C1440E"
    >帳</text>
  </g>
</svg>
